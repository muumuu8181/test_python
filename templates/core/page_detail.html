{% extends 'base.html' %}

{% block title %}{{ page.title }} | Corporate CMS{% endblock %}

{% block content %}
<div class="row">
    <div class="col-lg-12">
        <article>
            <header class="mb-4">
                <h1 class="fw-bolder mb-1">{{ page.title }}</h1>
                <div class="text-muted fst-italic mb-2">Last updated: {{ page.updated_at|date:"M d, Y" }}</div>
            </header>
            <section class="mb-5">
                {{ page.content|safe }}
            </section>
        </article>
    </div>
</div>
{% endblock %}
