get:
  summary: List all users
  tags:
    - Users
  responses:
    '200':
      description: A list of users
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../components/schemas/User.yaml'
    '500':
      description: Internal Server Error

post:
  summary: Create a new user
  tags:
    - Users
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/User.yaml'
  responses:
    '201':
      description: User created
      content:
        application/json:
          schema:
            $ref: '../components/schemas/User.yaml'
